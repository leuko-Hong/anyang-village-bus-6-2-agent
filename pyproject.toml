[project]
name = "anyang-bus-voice-agent"
version = "0.1.0"
description = "Voice agent for Anyang village bus 6-2 Geumjeong direction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pytest>=8.0.0",
]

[project.scripts]
app-cli = "app.cli:main"
config-check = "app.config_check:main"
model-probe = "app.model_probe:main"
fixture-probe = "tests.tools.fixture_probe:main"
audio-probe = "app.audio_probe:main"
provider-probe = "app.provider_probe:main"
intent-probe = "app.intent_probe:main"
response-probe = "app.response_probe:main"
stt-probe = "app.stt_probe:main"
run-qa = "scripts.run_qa:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.uv]
managed = true
package = false

[dependency-groups]
dev = [
    "basedpyright>=1.38.1",
]
